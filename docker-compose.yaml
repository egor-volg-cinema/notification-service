services:
    notification-service:
        container_name: notification-service
        image: egorcolg/notification-service:dev
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        env_file:
            - .env.prod.local
        networks:
            - cinema-network
networks:
    cinema-network:
        external: true
        name: docker_cinema-network
